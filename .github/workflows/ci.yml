name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  package:
    name: package installs clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # bin/canvas.js runs the CLI through tsx at runtime, so tsx must be a real
      # dependency. Installing the tarball outside the repo is the only thing
      # that actually proves it.
      - name: Pack
        run: npm pack

      - name: Install tarball globally
        run: npm install -g "$GITHUB_WORKSPACE"/reel-video-*.tgz

      # Run from a directory with NO node_modules. The bin spawns tsx, and a
      # bare `--import tsx` resolves from process.cwd() — so installing the
      # tarball into the same directory you then run from hides the bug that
      # broke `npx reel-video` in 0.1.0. This must run somewhere empty.
      # --skip-checks keeps this job about packaging, not about whether the
      # runner image ships ffmpeg. Preflight itself is covered by unit tests.
      - name: CLI runs from an empty directory
        run: |
          mkdir -p /tmp/emptydir
          cd /tmp/emptydir
          test ! -d node_modules
          reel-video --help
          reel-video init "ci smoke test" --skip-checks
          test -f canvas/project.json

      - name: CLI also works via npx from the tarball
        run: |
          mkdir -p /tmp/npxdir
          cd /tmp/npxdir
          npx --yes "$GITHUB_WORKSPACE"/reel-video-*.tgz init "npx smoke test" --skip-checks
          test -f canvas/project.json
